# 🌐 SOVEREIGN HIGH-VELOCITY MCP CONCURRENCY DEVOPS PIPELINE
name: Autonomous MCP Core Concurrency Load Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-saturation-stress-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest Source Code Matrix Logs
        uses: actions/checkout@v4

      - name: Mount Pristine Enterprise Python Container Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute 50-Agent High-Density Saturation Stress Drill
        # 🔑 THE SYSTEM FIX: Setting the Python Path context explicitly so the cloud runner maps local modules cleanly
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python test_concurrency_surge.py
